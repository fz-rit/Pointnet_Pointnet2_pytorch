# Feature Group Sensitivity Testing Configuration
# This config tests multiple feature groups to find the optimal one

# Model Configuration
model:
  name: "pointnet2_sem_seg"
  num_classes: 5
  npoint: 4096
  block_size: 2.0

# Training Parameters
training:
  batch_size: 32
  learning_rate: 0.005
  min_learning_rate: 0.0001
  epochs: 5  # Reduced for faster sensitivity testing
  optimizer: "Adam"
  decay_rate: 0.0001
  step_size: 10
  sample_rate: 1.0

# Data Configuration
data:
  root_dir: "/home/fzhcis/mylab/data/point_cloud_segmentation/palau_2024/previous/temp_0709"
  val_ratio: 0.25  # 25% for validation
  random_seed: 42
  feat_group: ["xyz", "xyzi0", "xyz_p3"]  # List of feature groups to test
  num_workers: 10

# Testing Parameters
testing:
  batch_size: 32
  block_points: 4096
  num_votes: 3
  test_idx: -1  # Test all files
  visual: true

# Hardware Configuration
hardware:
  gpu: "0"
  pin_memory: true
  drop_last: true

# Logging Configuration
logging:
  log_dir: null  # Will be auto-generated with feature group info
  save_interval: 5  # Save more frequently for shorter experiments

# Class Configuration
classes:
  names: ["Ground", "Stem", "Canopy", "Roots", "Objects"]
  colors: [[128, 0, 128], [165, 42, 42], [0, 128, 0], [255, 165, 0], [255, 255, 0]]

# Paths (relative to project root)
paths:
  models_dir: "models"
  log_dir: "log/sem_seg"
  checkpoints_dir: "checkpoints"
  results_dir: "results"
