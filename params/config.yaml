# Mangrove3D Point Cloud Segmentation Configuration
# This file contains all parameters for training and testing

# Model Configuration
model:
  name: "pointnet2_sem_seg"
  num_classes: 5
  npoint: 4096
  block_size: 40.0

# Training Parameters
training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  optimizer: "Adam"
  decay_rate: 1e-4
  step_size: 10
  lr_decay: 0.7
  sample_rate: 1.0

# Data Configuration
data:
  root_dir: "/home/fzhcis/mylab/data/point_cloud_segmentation/palau_2024"
  val_ratio: 0.1  # 10% for validation
  random_seed: 42
  color_group: "irz"  # Options: irz, p3, cap, n3
  num_workers: 10

# Testing Parameters
testing:
  batch_size: 32
  block_points: 4096
  num_votes: 3
  test_idx: 0
  visual: true
  model_path: "./log/sem_seg/2025-07-09_21-05/checkpoints/best_model_2025-07-09_21-05.pth"
  output_dir: "/home/fzhcis/mylab/data/point_cloud_segmentation/palau_2024/test_results"

# Hardware Configuration
hardware:
  gpu: "0"
  pin_memory: true
  drop_last: true

# Logging Configuration
logging:
  log_dir: null  # If null, will use timestamp-based directory
  save_interval: 5  # Save checkpoint every N epochs

# Class Configuration
classes:
  names: ["Ground", "Stem", "Canopy", "Roots", "Objects"]
  colors: [[128, 0, 128], [165, 42, 42], [0, 128, 0], [255, 165, 0], [255, 255, 0]]

# Paths (relative to project root)
paths:
  models_dir: "models"
  log_dir: "log/sem_seg"
  checkpoints_dir: "checkpoints"
  results_dir: "results"
