# Quick Training Configuration
# Reduced parameters for fast experimentation

# Model Configuration
model:
  name: "pointnet2_sem_seg"
  num_classes: 5
  npoint: 2048  # Reduced for faster training
  block_size: 20.0  # Smaller blocks

# Training Parameters
training:
  batch_size: 16  # Smaller batch size
  learning_rate: 0.01
  min_learning_rate: 0.0001
  epochs: 3      # Few epochs for quick testing
  learning_rate: 0.002  # Slightly higher LR
  optimizer: "Adam"
  decay_rate: 1e-4
  step_size: 5    # More frequent LR decay
  sample_rate: 0.5  # Use only 50% of data

# Data Configuration
data:
  root_dir: "/home/fzhcis/mylab/data/point_cloud_segmentation/palau_2024"
  val_ratio: 0.2  # Smaller validation set
  random_seed: 42
  feat_group: "xyz_irz" # Options: xyz, xyzi0, xyz_irz, xyz_p3, xyz_cap, xyz_n3
  num_workers: 4  # Fewer workers

# Testing Parameters
testing:
  batch_size: 16
  block_points: 2048
  num_votes: 1  # Single vote for speed
  test_idx: 0  # Set to -1 to test all available files, or >=0 for specific file index
  visual: true
  # model_path and output_dir are auto-generated based on training settings
  # model_path: auto-generated as {log_dir}/checkpoints/best_model_{feat_group}.pth
  # output_dir: auto-generated as {data.root_dir}/test_results

# Hardware Configuration
hardware:
  gpu: "0"
  pin_memory: true
  drop_last: true

# Logging Configuration
logging:
  log_dir: "./log/sem_seg/quick_test"
  save_interval: 2  # Save more frequently

# Class Configuration
classes:
  names: ["Ground", "Stem", "Canopy", "Roots", "Objects"]
  colors: [[128, 0, 128], [165, 42, 42], [0, 128, 0], [255, 165, 0], [255, 255, 0]]

# Paths
paths:
  models_dir: "models"
  log_dir: "log/sem_seg"
  checkpoints_dir: "checkpoints"
  results_dir: "results"
