# High-Quality Training Configuration
# Optimized parameters for best results

# Model Configuration
model:
  name: "pointnet2_sem_seg"
  num_classes: 5
  npoint: 8192  # More points for better resolution
  block_size: 40.0

# Training Parameters
training:
  batch_size: 8   # Smaller batch for larger point clouds
  epochs: 40     # Extended training
  learning_rate: 0.0005  # Lower LR for stability
  optimizer: "Adam"
  decay_rate: 5e-5  # Less weight decay
  step_size: 20     # Less frequent LR decay
  lr_decay: 0.5     # More aggressive decay
  sample_rate: 1.0  # Use all data

# Data Configuration
data:
  root_dir: "/home/fzhcis/mylab/data/point_cloud_segmentation/palau_2024/temp"
  val_ratio: 0.25
  random_seed: 42
  color_group: "irz"
  num_workers: 8

# Testing Parameters
testing:
  batch_size: 4   # Small batch for large point clouds
  block_points: 8192
  num_votes: 10   # More votes for better accuracy
  test_idx: 0
  visual: true
  model_path: "./log/sem_seg/high_quality/checkpoints/best_model.pth"
  output_dir: "/home/fzhcis/mylab/data/point_cloud_segmentation/palau_2024/temp/high_quality_results"

# Hardware Configuration
hardware:
  gpu: "0"
  pin_memory: true
  drop_last: true

# Logging Configuration
logging:
  log_dir: "./log/sem_seg/high_quality"
  save_interval: 10  # Save less frequently

# Class Configuration
classes:
  names: ["Ground", "Stem", "Canopy", "Roots", "Objects"]
  colors: [[128, 0, 128], [165, 42, 42], [0, 128, 0], [255, 165, 0], [255, 255, 0]]

# Paths
paths:
  models_dir: "models"
  log_dir: "log/sem_seg"
  checkpoints_dir: "checkpoints"
  results_dir: "results"
